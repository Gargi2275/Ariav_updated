<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="description" content="Production Gujarat textile & commercial agency ERP for order booking, sales billing, double-entry ledger, and multi-branch operations." />
    <meta property="og:title" content="Remix Ariav ERP" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Dual Font Load Path: <link> tags + <style> @import with explicit fallback stacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Roboto+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..600,400;0,8..600,600;0,8..600,700;1,8..600,400&display=swap" rel="stylesheet">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Roboto+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..600,400;0,8..600,600;0,8..600,700;1,8..600,400&display=swap');

      :root {
        --font-display: 'Source Serif 4', 'Lora', Georgia, serif;
        --font-body: 'IBM Plex Sans', 'Inter', -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', 'Roboto Mono', Consolas, monospace;
      }

      html, body {
        font-family: var(--font-body) !important;
      }

      h1, h2, h3, h4, h5, h6, .font-display, .font-serif, [data-font="display"], .eyebrow-label, .module-breadcrumb {
        font-family: var(--font-display) !important;
      }

      .font-body, .font-sans, [data-font="body"] {
        font-family: var(--font-body) !important;
      }

      .font-mono, [data-font="mono"], .amt, [class*="amt"], [class*="mono"], code, kbd, pre, .mono-figure {
        font-family: var(--font-mono) !important;
      }
    </style>
  </head>
  <body class="bg-[#0F141B] text-[#ECE9E1] antialiased selection:bg-[#C9A24E] selection:text-[#0F141B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
