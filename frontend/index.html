<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FABSETU ERP</title>
    <meta name="application-name" content="FABSETU ERP" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Production Gujarat textile ERP for order booking, sales billing, double-entry ledger, and multi-entity operations." />
    <meta property="og:title" content="FABSETU ERP" />
    <meta property="og:description" content="Production Gujarat textile ERP for order booking, sales billing, double-entry ledger, and multi-entity operations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Typefaces are self-hosted via Fontsource imports in src/main.tsx -->
    <style>
      :root {
        --font-display: 'Fraunces', Georgia, serif;
        --font-body: 'IBM Plex Sans', 'Inter', -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', 'Roboto Mono', Consolas, monospace;
      }

      html, body {
        font-family: var(--font-body) !important;
      }

      h1, h2, h3, h4, h5, h6, .font-display, .font-serif, [data-font="display"], .eyebrow-label, .module-breadcrumb {
        font-family: var(--font-display) !important;
      }

      .font-body, .font-sans, [data-font="body"] {
        font-family: var(--font-body) !important;
      }

      .font-mono, [data-font="mono"], .amt, [class*="amt"], [class*="mono"], code, kbd, pre, .mono-figure {
        font-family: var(--font-mono) !important;
      }
    </style>
  </head>
  <body class="bg-[#0F141B] text-[#ECE9E1] antialiased selection:bg-[#C9A24E] selection:text-[#0F141B]">
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ariav_prefs_cache');
          var prefs = raw ? JSON.parse(raw) : {};
          var theme = prefs.theme || localStorage.getItem('ariav_theme') || 'dark';
          var dark = theme === 'dark' || (theme !== 'light' && (theme !== 'system' || window.matchMedia('(prefers-color-scheme: dark)').matches));
          var root = document.documentElement;
          root.classList.add(dark ? 'theme-dark' : 'theme-light');
          if (prefs.highContrast) root.classList.add('theme-contrast');
          if (prefs.largeTargets) root.classList.add('targets-large');
          if (prefs.textSize) root.dataset.textSize = prefs.textSize;
          if (prefs.density) root.dataset.uiDensity = prefs.density;
          if (prefs.tableDensity) root.dataset.tableDensity = prefs.tableDensity;
          if (prefs.reducedMotion === 'reduce' || (prefs.reducedMotion !== 'allow' && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
            root.classList.add('motion-reduce');
          }
          document.body.style.backgroundColor = dark ? '#0F141B' : '#F6F2E8';
          document.body.style.color = dark ? '#ECE9E1' : '#1B2430';
        } catch (error) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
